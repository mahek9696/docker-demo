<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QA Login Application</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f4f6f8;
    }
    .login-container {
      width: 380px;
      background: white;
      padding: 35px;
      border-radius: 12px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.12);
    }
    h1 {
      text-align: center;
      margin-bottom: 8px;
    }
    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
    }
    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 6px;
      font-weight: bold;
    }
    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
    }
    .remember {
      margin-top: 15px;
      font-size: 14px;
    }
    button {
      width: 100%;
      margin-top: 20px;
      padding: 12px;
      border: none;
      border-radius: 6px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }
    button:hover {
      background: #1d4ed8;
    }
    #loginResult {
      text-align: center;
      margin-top: 18px;
      font-weight: bold;
    }
    .version {
      text-align: center;
      margin-top: 20px;
      font-size: 12px;
      color: #888;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <h1>QA Bank</h1>
    <div class="subtitle">Secure Login</div>
 
    <label for="username">Username</label>
    <input type="text" id="username" placeholder="Enter username">
 
    <label for="password">Password</label>
    <input type="password" id="password" placeholder="Enter password">
 
    <div class="remember">
      <input type="checkbox" id="rememberMe"> Remember me
    </div>
 
    <button id="loginBtn" onclick="login()">Login</button>
    <div id="loginResult"></div>
 
    <div class="version">Environment: DEV | Version: V1</div>
  </div>
 
  <script>
    function login() {
      const username = document.getElementById("username").value;
      const password = document.getElementById("password").value;
      const result = document.getElementById("loginResult");
 
      if (username === "admin" && password === "admin123") {
        result.innerHTML = "Login Successful";
        result.style.color = "green";
      } else {
        result.innerHTML = "Invalid Username or Password";
        result.style.color = "red";
      }
    }
  </script>
</body>
</html>
